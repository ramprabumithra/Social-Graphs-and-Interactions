  }

  a { color: var(--blue); }

    filter: invert(1);
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  header.masthead {

    color: var(--paper);

    text-align: center;

  }

  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-bottom: 1rem;
    position: relative;
  }

  h1.title {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(2.1rem, 6vw, 3.6rem);
    line-height: 1;
    margin: 0 0 0.9rem;
    position: relative;
  }

  h1.title .accent { color: var(--red); }

  .subhead {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: #C9C4B6;

    margin: 0 auto;
    position: relative;
  }

  main {

    margin: 0 auto;

  }

  .panel {

    border: 1px solid var(--rule);
    padding: 1.8rem;
    margin-bottom: 1.6rem;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    flex-wrap: wrap;
  }

  .field {
    flex: 1 1 220px;
    position: relative;
  }

  .field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 0.4rem;
  }

  .field input {
    width: 100%;
    font-family: 'Source Serif 4', serif;
    font-size: 1.05rem;
    padding: 0.6rem 0.7rem;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
  }

  .field input:focus {
    outline: none;
    border-color: var(--red);
  }

  .swap-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    background: var(--paper-deep);
    border: 2px solid var(--ink);
    width: 42px;
    height: 42px;
    cursor: pointer;
    align-self: flex-end;
    margin-bottom: 0.05rem;
    color: var(--ink);
  }
  .swap-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold); }

  .autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 2px solid var(--ink);
    border-top: none;
    max-height: 240px;
    overflow-y: auto;
    z-index: 20;
    display: none;
  }

  .autocomplete-list div {
    padding: 0.55rem 0.7rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.86rem;
    cursor: pointer;
    border-bottom: 1px solid var(--paper-deep);
  }

  .autocomplete-list div:hover,
  .autocomplete-list div.active {
    background: var(--gold);
    color: #fff;
  }

  .go-row {
    margin-top: 1.3rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  button.go {
    font-family: 'Anton', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    background: var(--red);
    color: #fff;
    border: none;
    padding: 0.75rem 1.8rem;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  button.go:hover { background: #8f2e23; }
  button.go:disabled { background: var(--rule); cursor: not-allowed; }

  button.random {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    background: none;
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    padding: 0.6rem 1rem;
    cursor: pointer;
  }
  button.random:hover { border-color: var(--red); color: var(--red); }

  #resultArea { margin-top: 0.5rem; }

  .result-degree {

  .result-degree .big-num {

    font-size: 4.5rem;
    line-height: 1;
    color: var(--red);

  .result-degree .big-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    margin-top: 0.4rem;
  }

  .path-chain {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-top: 1rem;
  }

  .path-node {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.55rem 0.2rem;
  }

  .path-node .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--blue);
    flex-shrink: 0;
  }
  .path-node:first-child .dot,
  .path-node:last-child .dot { background: var(--red); width: 15px; height: 15px; }

  .path-node .name {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.12rem;
  }

  .path-connector {
    display: flex;
    align-items: center;
    padding-left: 5px;
    color: var(--ink-soft);
  }

  .path-connector .line {
    width: 2px;
    height: 26px;
    background: var(--rule);
    margin-right: calc(0.9rem + 4px);
  }

  .path-connector .arrow-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  .not-found {
    text-align: center;
    padding: 2.2rem 1rem;
  }

  .not-found .big-icon {
    font-family: 'Anton', sans-serif;
    font-size: 2.6rem;
    color: var(--rule);

  .not-found p {

    margin: 0.8rem auto 0;
    font-size: 1rem;

  .stats-strip {

const idToName = {};
GRAPH.nodes.forEach(n => idToName[n.id] = n.name);
const nameList = GRAPH.nodes.map(n => ({id: n.id, name: n.name}));

// build adjacency lists: directed and undirected
const adjDirected = {};
const adjUndirected = {};
GRAPH.nodes.forEach(n => { adjDirected[n.id] = []; adjUndirected[n.id] = []; });
GRAPH.edges.forEach(([a, b]) => {
  adjDirected[a].push(b);
  adjUndirected[a].push(b);
  adjUndirected[b].push(a);
});

function bfsPath(startId, endId, directed) {
  if (startId === endId) return [startId];
  const adj = directed ? adjDirected : adjUndirected;
  const visited = new Set([startId]);
  const parent = {};
  const queue = [startId];
  let qi = 0;
  while (qi < queue.length) {
    const cur = queue[qi++];
    for (const next of adj[cur]) {
      if (!visited.has(next)) {
        visited.add(next);
        parent[next] = cur;
        if (next === endId) {
          // reconstruct path
          const path = [endId];
          let p = endId;
          while (p !== startId) {
            p = parent[p];
            path.push(p);
          }
          return path.reverse();
        }
        queue.push(next);
      }
    }
  }
  return null;
}

function edgeDirection(a, b) {
  const aToB = GRAPH.edges.some(([x,y]) => x===a && y===b);
  const bToA = GRAPH.edges.some(([x,y]) => x===b && y===a);
  if (aToB && bToA) return '↔ mutual link';
  if (aToB) return '→ links to';
  if (bToA) return '← linked from';
  return '';
}

// ---------- Autocomplete ----------
function setupAutocomplete(inputEl, listEl, otherInputEl) {
  let activeIndex = -1;
  let currentMatches = [];

  function render(matches) {
    currentMatches = matches;
    activeIndex = -1;
    if (matches.length === 0) { listEl.style.display = 'none'; return; }
    listEl.innerHTML = matches.slice(0, 12).map((m, i) =>
      `<div data-id="${m.id}" data-i="${i}">${m.name}</div>`
    ).join('');
    listEl.style.display = 'block';
  }

  inputEl.addEventListener('input', () => {
    const q = inputEl.value.trim().toLowerCase();
    inputEl.dataset.selectedId = '';
    updateGoState();
    if (q.length === 0) { listEl.style.display = 'none'; return; }
    const matches = nameList.filter(n => n.name.toLowerCase().includes(q));
    render(matches);
  });

  inputEl.addEventListener('keydown', (e) => {
    if (listEl.style.display === 'none') return;
    const items = listEl.querySelectorAll('div');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && currentMatches[activeIndex]) {
        selectMatch(currentMatches[activeIndex]);
      }
    } else if (e.key === 'Escape') {
      listEl.style.display = 'none';
    }
  });

  function selectMatch(m) {
    inputEl.value = m.name;
    inputEl.dataset.selectedId = m.id;
    listEl.style.display = 'none';
    updateGoState();
  }

  listEl.addEventListener('mousedown', (e) => {
    const div = e.target.closest('div[data-id]');
    if (!div) return;
    const m = nameList.find(n => n.id === div.dataset.id);
    if (m) selectMatch(m);
  });

  document.addEventListener('click', (e) => {
    if (!inputEl.contains(e.target) && !listEl.contains(e.target)) {
      listEl.style.display = 'none';
    }
  });

  inputEl.setById = (id) => {
    const m = nameList.find(n => n.id === id);
    if (m) selectMatch(m);
  };
}

const fromInput = document.getElementById('fromInput');
const toInput = document.getElementById('toInput');
const fromList = document.getElementById('fromList');
const toList = document.getElementById('toList');
const goBtn = document.getElementById('goBtn');

setupAutocomplete(fromInput, fromList);
setupAutocomplete(toInput, toList);

function updateGoState() {
  goBtn.disabled = !(fromInput.dataset.selectedId && toInput.dataset.selectedId);
}

document.getElementById('swapBtn').addEventListener('click', () => {
  const fv = fromInput.value, fid = fromInput.dataset.selectedId;
  const tv = toInput.value, tid = toInput.dataset.selectedId;
  fromInput.value = tv; fromInput.dataset.selectedId = tid || '';
  toInput.value = fv; toInput.dataset.selectedId = fid || '';
  updateGoState();
});

document.querySelectorAll('.examples button').forEach(btn => {
  btn.addEventListener('click', () => {
    fromInput.setById(btn.dataset.a);
    toInput.setById(btn.dataset.b);
    runSearch();
  });
});

document.getElementById('randomBtn').addEventListener('click', () => {
  const a = nameList[Math.floor(Math.random() * nameList.length)];
  let b = nameList[Math.floor(Math.random() * nameList.length)];
  while (b.id === a.id) b = nameList[Math.floor(Math.random() * nameList.length)];
  fromInput.setById(a.id);
  toInput.setById(b.id);
  runSearch();
});

goBtn.addEventListener('click', runSearch);

function runSearch() {
  const startId = fromInput.dataset.selectedId;
  const endId = toInput.dataset.selectedId;
  if (!startId || !endId) return;
  const directed = document.getElementById('directedToggle').checked;
  const path = bfsPath(startId, endId, directed);
  renderResult(path, startId, endId, directed);
}

function renderResult(path, startId, endId, directed) {
  const area = document.getElementById('resultArea');
  if (!path) {
    area.innerHTML = `
      <div class="panel not-found">
        <div class="big-icon">NO PATH</div>
        <p>${idToName[startId]} and ${idToName[endId]} live in different, disconnected corners of this network${directed ? ' (at least when only following link direction)' : ''}. No sequence of links — however long — bridges them here.</p>
      </div>`;
    return;
  }
  const degrees = path.length - 1;
  let chainHtml = '';
  path.forEach((id, i) => {
    if (i > 0) {
      const dir = directed ? '→ links to' : edgeDirection(path[i-1], id) || '— connected —';
      chainHtml += `<div class="path-connector"><div class="line"></div><span class="arrow-label">${dir}</span></div>`;
    }
    chainHtml += `<div class="path-node"><div class="dot"></div><div class="name">${idToName[id]}</div></div>`;
  });

  area.innerHTML = `
    <div class="panel">
      <div class="result-degree">
        <div class="big-num">${degrees}</div>
        <div class="big-label">DEGREE${degrees === 1 ? '' : 'S'} OF SEPARATION</div>
      </div>
      <div class="path-chain">${chainHtml}</div>
      <div class="stats-strip">
        <div class="s"><div class="n">${path.length}</div><div class="l">CHARACTERS IN PATH</div></div>
        <div class="s"><div class="n">${directed ? 'DIRECTED' : 'UNDIRECTED'}</div><div class="l">SEARCH MODE</div></div>
        <div class="s"><div class="n">BFS</div><div class="l">GUARANTEES SHORTEST</div></div>
      </div>
    </div>`;
}
</script>

</body>
